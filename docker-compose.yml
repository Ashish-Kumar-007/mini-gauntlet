services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: mini_gauntlet
      POSTGRES_USER: mini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini -d mini_gauntlet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://mini:${POSTGRES_PASSWORD:-mini-local-only}@db:5432/mini_gauntlet
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://mini:${POSTGRES_PASSWORD:-mini-local-only}@db:5432/mini_gauntlet
      INVENTORY_PATH: /app/data/inventory.json
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-4}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/data/inventory.json:/app/data/inventory.json:ro
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://mini:${POSTGRES_PASSWORD:-mini-local-only}@db:5432/mini_gauntlet
      INVENTORY_PATH: /app/data/inventory.json
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-4}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/data/inventory.json:/app/data/inventory.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:

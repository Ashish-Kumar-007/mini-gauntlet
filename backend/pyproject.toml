[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-gauntlet"
version = "0.1.0"
description = "Simulated cloud security posture scanner"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic==1.15.2",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.6",
    "pydantic==2.11.3",
    "sqlalchemy==2.0.40",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
